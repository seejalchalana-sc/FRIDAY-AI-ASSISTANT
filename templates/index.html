<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>friday</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg: #050810;
    --violet: #7C5CFF;
    --cyan: #00F0FF;
    --magenta: #FF3D8A;
    --mint: #4AFFB0;
    --slate: #8892A6;
    --panel-bg: rgba(8, 12, 22, 0.92);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Space Grotesk', sans-serif;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(124,92,255,0.06), transparent 60%),
      var(--bg);
  }

  .noise {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 34px 34px;
    pointer-events: none;
  }

  /* draggable titlebar area (frameless window) */
  .titlebar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 40px;
    -webkit-app-region: drag;
    z-index: 5;
  }

  .panel-toggle {
    position: absolute;
    top: 28px;
    left: 28px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(136,146,166,0.25);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    -webkit-app-region: no-drag;
    transition: border-color 0.25s ease, background 0.25s ease;
  }
  .panel-toggle:hover {
    border-color: var(--violet);
    background: rgba(124,92,255,0.08);
  }
  .panel-toggle svg { width: 18px; height: 18px; stroke: var(--slate); transition: stroke 0.25s ease; }
  .panel-toggle:hover svg { stroke: var(--violet); }

  .brand {
    position: absolute;
    top: 36px;
    left: 84px;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--slate);
    text-transform: uppercase;
    z-index: 12;
    font-weight: 500;
    transition: opacity 0.3s ease;
  }
  .brand span { color: #fff; }
  .panel.open ~ .brand { opacity: 0; pointer-events: none; }

  /* ---------- Quick action icons ---------- */
  .quick-actions {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 3;
    transition: opacity 0.3s ease;
  }
  .panel.open ~ .quick-actions { opacity: 0; pointer-events: none; }
  .qa-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 24px;
    border: 1px solid rgba(136,146,166,0.2);
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(8px);
    color: var(--slate);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .qa-btn:hover {
    border-color: var(--violet);
    color: #fff;
    background: rgba(124,92,255,0.08);
  }
  .qa-btn svg { width: 14px; height: 14px; stroke: currentColor; flex-shrink: 0; }

  .core-wrap {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }

  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--ring-color, rgba(124,92,255,0.35));
    opacity: 0;
    animation: ripple 3.6s ease-out infinite;
  }
  .ring.r1 { width: 140px; height: 140px; animation-delay: 0s; }
  .ring.r2 { width: 140px; height: 140px; animation-delay: 1.2s; }
  .ring.r3 { width: 140px; height: 140px; animation-delay: 2.4s; }

  @keyframes ripple {
    0%   { width: 140px; height: 140px; opacity: 0.55; }
    100% { width: 420px; height: 420px; opacity: 0; }
  }

  .orb-core {
    position: relative;
    width: 128px;
    height: 128px;
    border-radius: 50%;
    z-index: 5;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), var(--core-color, var(--violet)) 55%, rgba(0,0,0,0.2) 100%);
    box-shadow:
      0 0 40px 6px var(--glow-color, rgba(124,92,255,0.55)),
      0 0 90px 20px var(--glow-color-outer, rgba(124,92,255,0.25)),
      inset 0 0 24px rgba(255,255,255,0.35);
    animation: breathe 3.2s ease-in-out infinite;
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.055); }
  }

  .state-label {
    position: absolute;
    bottom: -64px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
    z-index: 3;
    transition: opacity 0.3s ease;
  }
  .panel.open ~ .core-wrap .state-label,
  .panel.open ~ .core-wrap { opacity: 0; pointer-events: none; }
  .state-word {
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--label-color, var(--violet));
    font-weight: 500;
    transition: color 0.5s ease;
  }
  .state-sub {
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--slate);
    letter-spacing: 0.02em;
  }

  .app[data-state="idle"] {
    --ring-color: rgba(124,92,255,0.28);
    --core-color: #7C5CFF;
    --glow-color: rgba(124,92,255,0.5);
    --glow-color-outer: rgba(124,92,255,0.2);
    --label-color: #7C5CFF;
  }
  .app[data-state="listening"], .app[data-state="lsitening"] {
    --ring-color: rgba(0,240,255,0.4);
    --core-color: #00F0FF;
    --glow-color: rgba(0,240,255,0.6);
    --glow-color-outer: rgba(0,240,255,0.25);
    --label-color: #00F0FF;
  }
  .app[data-state="listening"] .ring, .app[data-state="lsitening"] .ring { animation-duration: 1.8s; }
  .app[data-state="listening"] .orb-core, .app[data-state="lsitening"] .orb-core { animation-duration: 1.1s; }

  .app[data-state="thinking"] {
    --ring-color: rgba(255,61,138,0.4);
    --core-color: #FF3D8A;
    --glow-color: rgba(255,61,138,0.6);
    --glow-color-outer: rgba(255,61,138,0.25);
    --label-color: #FF3D8A;
  }
  .app[data-state="thinking"] .ring { animation-duration: 1s; }
  .app[data-state="thinking"] .orb-core { animation-duration: 0.6s; }

  .app[data-state="speaking"] {
    --ring-color: rgba(74,255,176,0.4);
    --core-color: #4AFFB0;
    --glow-color: rgba(74,255,176,0.6);
    --glow-color-outer: rgba(74,255,176,0.25);
    --label-color: #4AFFB0;
  }
  .app[data-state="speaking"] .ring { animation-duration: 1.4s; }
  .app[data-state="speaking"] .orb-core { animation-duration: 0.9s; }

  /* ---------- Side panel ---------- */
  .panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 380px;
    height: 100%;
    background: #080C16;
    border-right: 1px solid rgba(136,146,166,0.15);
    transform: translateX(-100%);
    transition: transform 0.38s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 40;
    display: flex;
    flex-direction: column;
    box-shadow: 20px 0 60px rgba(0,0,0,0.5);
  }
  .panel.open { transform: translateX(0); }

  .panel-header {
    padding: 28px 24px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(136,146,166,0.12);
  }
  .panel-title {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 500;
  }
  .panel-close {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--slate);
    transition: color 0.2s ease;
  }
  .panel-close:hover { color: #fff; }
  .panel-close svg { width: 14px; height: 14px; }

  .panel-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel-log::-webkit-scrollbar { width: 4px; }
  .panel-log::-webkit-scrollbar-thumb { background: rgba(136,146,166,0.3); border-radius: 4px; }

  .msg { max-width: 88%; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg.friday { align-self: flex-start; }

  .msg-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--slate);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .msg-bubble {
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 14px;
    border-radius: 10px;
    color: #E4E7EE;
    word-wrap: break-word;
  }
  .msg.friday .msg-bubble {
    background: rgba(124,92,255,0.08);
    border: 1px solid rgba(124,92,255,0.18);
    border-top-left-radius: 3px;
  }
  .msg.user .msg-bubble {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-top-right-radius: 3px;
  }

  .panel-footer {
    padding: 16px 24px 22px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--slate);
    border-top: 1px solid rgba(136,146,166,0.12);
  }
  .panel-footer b { color: #fff; }

  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.38s ease;
    z-index: 15;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }

</style>
</head>
<body>

<div class="app" data-state="idle" id="app">
  <div class="noise"></div>
  <div class="titlebar"></div>

  <div class="panel-toggle" id="panelToggle">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
  </div>
  <div class="brand">FRIDAY <span>// CORE</span></div>

  <div class="scrim" id="scrim"></div>

  <div class="panel" id="panel">
    <div class="panel-header">
      <div class="panel-title">Session Log</div>
      <div class="panel-close" id="panelClose">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
      </div>
    </div>
    <div class="panel-log" id="panelLog"></div>
    <div class="panel-footer">
      v1.0 · Local instance · built by <b>Seejal Chalana</b>
    </div>
  </div>

  <div class="core-wrap">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="orb-core"></div>
    <div class="state-label">
      <div class="state-word" id="stateWord">Idle</div>
      <div class="state-sub" id="stateSub">say "friday" to wake</div>
    </div>
  </div>

  <div class="quick-actions">
    <div class="qa-btn" data-action="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V11l-8-8Z"/><path d="M13 3v6h6"/></svg>
      Notes
    </div>
    <div class="qa-btn" data-action="expenses">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Expenses
    </div>
    <div class="qa-btn" data-action="time">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      Time &amp; Date
    </div>
    <div class="qa-btn" data-action="system">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg>
      System
    </div>
  </div>
</div>

<script>
  const app = document.getElementById('app');
  const stateWord = document.getElementById('stateWord');
  const stateSub = document.getElementById('stateSub');
  const panel = document.getElementById('panel');
  const panelToggle = document.getElementById('panelToggle');
  const panelClose = document.getElementById('panelClose');
  const scrim = document.getElementById('scrim');
  const panelLog = document.getElementById('panelLog');

  const stateCopy = {
    idle:      { word: 'Idle',      sub: 'say "friday" to wake' },
    listening: { word: 'Listening', sub: "go ahead, i'm listening" },
    lsitening: { word: 'Listening', sub: "go ahead, i'm listening" }, // tolerate the known backend typo
    thinking:  { word: 'Thinking',  sub: 'processing your request' },
    speaking:  { word: 'Speaking',  sub: 'output in progress' },
  };

  function setState(rawState) {
    const s = (rawState || 'idle').toLowerCase();
    const copy = stateCopy[s] || stateCopy.idle;
    app.setAttribute('data-state', s);
    stateWord.textContent = copy.word;
    stateSub.textContent = copy.sub;
  }

  function openPanel() {
    panel.classList.add('open');
    scrim.classList.add('show');
  }
  function closePanel() {
    panel.classList.remove('open');
    scrim.classList.remove('show');
  }
  panelToggle.addEventListener('click', openPanel);
  panelClose.addEventListener('click', closePanel);
  scrim.addEventListener('click', closePanel);

  // ---------- Real backend polling (same endpoints as before) ----------
  async function pollStatus() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      setState(data.status || data.current_status);
    } catch (e) { /* silent, keep polling */ }
    setTimeout(pollStatus, 500);
  }

  let lastLogLength = 0;
  function renderMessage(entry) {
    const role = (entry.role || '').toLowerCase();
    const isUser = role === 'user' || role === 'you';
    const div = document.createElement('div');
    div.className = 'msg ' + (isUser ? 'user' : 'friday');

    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const label = isUser ? 'You' : 'Friday';
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.textContent = label + ' · ' + time;

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = entry.text || entry.message || '';

    div.appendChild(meta);
    div.appendChild(bubble);
    panelLog.appendChild(div);
    panelLog.scrollTop = panelLog.scrollHeight;
  }

  async function pollLog() {
    try {
      const res = await fetch('/api/log');
      const data = await res.json();
      const log = data.log || data.conversation_log || [];
      if (log.length > lastLogLength) {
        for (let i = lastLogLength; i < log.length; i++) {
          renderMessage(log[i]);
        }
        lastLogLength = log.length;
      }
    } catch (e) { /* silent, keep polling */ }
    setTimeout(pollLog, 800);
  }

  pollStatus();
  pollLog();

  // ---------- Quick action buttons ----------
  const actionMessages = {
    notes: 'Say "read my notes" to hear your saved notes.',
    expenses: 'Say "how much have I spent" for your expense total.',
    time: 'Say "what time is it" or "what\'s today\'s date".',
    system: 'Say "battery" or "memory usage" for a system status check.',
  };

  document.querySelectorAll('.qa-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      openPanel();
      const action = btn.dataset.action;
      const div = document.createElement('div');
      div.className = 'msg friday';
      const meta = document.createElement('div');
      meta.className = 'msg-meta';
      meta.textContent = 'Friday · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = actionMessages[action] || '';
      div.appendChild(meta);
      div.appendChild(bubble);
      panelLog.appendChild(div);
      panelLog.scrollTop = panelLog.scrollHeight;
    });
  });
</script>

</body>
</html>
